name: Build SalamaChat debug APK

on:
  push:
    branches:
      - kenya-theme
    paths:
      - 'briar-android/**'
      - 'bramble-android/**'
      - 'bramble-core/**'
      - 'bramble-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'gradle-dependencies.gradle'
      - '.github/workflows/build-salamachat-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salamachat-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit-test SalamaChat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build SalamaChat debug APK
        run: ./gradlew --no-daemon --stacktrace :briar-android:assembleOfficialDebug

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace :briar-android:testOfficialDebugUnitTest

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salamachat-debug-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
