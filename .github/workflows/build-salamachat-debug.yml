name: Build SalamaChat test APKs

on:
  push:
    branches:
      - kenya-theme
    paths:
      - 'briar-android/**'
      - 'bramble-android/**'
      - 'bramble-core/**'
      - 'bramble-api/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'gradle-dependencies.gradle'
      - '.github/workflows/build-salamachat-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salamachat-test-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit-test SalamaChat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build SalamaChat debug APK
        run: ./gradlew --no-daemon --stacktrace :briar-android:assembleOfficialDebug

      - name: Run Android debug unit tests
        run: ./gradlew --no-daemon --stacktrace :briar-android:testOfficialDebugUnitTest

      - name: Build SalamaChat release-variant test APK
        run: ./gradlew --no-daemon --stacktrace :briar-android:assembleOfficialRelease

      # This temporary key is only for user testing. It is not a production signing key.
      - name: Sign release-variant APK for testing
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find briar-android/build/outputs/apk/official/release -maxdepth 1 -name '*unsigned.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Could not find the unsigned official release APK."
            find briar-android/build/outputs/apk/official/release -maxdepth 1 -type f -print
            exit 1
          fi
          keytool -genkeypair -noprompt -v \
            -keystore "$RUNNER_TEMP/salamachat-test-release.jks" \
            -storepass testpassword -keypass testpassword \
            -alias salamachat-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SalamaChat Test,O=SalamaChat,C=KE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/salamachat-test-release.jks" \
            --ks-key-alias salamachat-test \
            --ks-pass pass:testpassword --key-pass pass:testpassword \
            --out "$RUNNER_TEMP/SalamaChat-release-test.apk" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            "$RUNNER_TEMP/SalamaChat-release-test.apk"

      - name: Upload release-variant test APK (not production-signed)
        uses: actions/upload-artifact@v4
        with:
          name: salamachat-release-variant-test-apk
          path: ${{ runner.temp }}/SalamaChat-release-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salamachat-debug-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
