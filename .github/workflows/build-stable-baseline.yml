# This workflow intentionally builds the untouched upstream stable baseline before product changes.
name: Build Briar 1.5.21 stable baseline

on:
  push:
    branches:
      - build/briar-1.5.21-baseline
    paths:
      - .github/workflows/build-stable-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-baseline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit-test stable Android baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact baseline including submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Briar 1.5.21 debug APK
        run: ./gradlew --no-daemon --stacktrace :briar-android:assembleOfficialDebug

      - name: Run Android unit tests
        run: ./gradlew --no-daemon --stacktrace :briar-android:testOfficialDebugUnitTest

      - name: Upload debug APK for device testing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salama-chat-briar-1.5.21-baseline-debug-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
